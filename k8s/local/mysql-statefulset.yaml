apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: support-desk
spec:
  serviceName: mysql # doit pointer vers le Service headless ci-dessus
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4 # même version que docker-compose.yml
          ports:
            - containerPort: 3306
          # L'image mysql attend des noms de variables différents des nôtres
          # (MYSQL_DATABASE, pas DB_NAME) : on référence donc chaque clé individuellement
          # plutôt que d'importer tout le ConfigMap/Secret en bloc avec envFrom.
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: support-desk-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: support-desk-secret
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: support-desk-secret
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: support-desk-secret
                  key: MYSQL_ROOT_PASSWORD
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

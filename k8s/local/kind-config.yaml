# kind cluster: 1 control-plane + 2 workers.
#
# The control-plane node gets:
#   - the ingress-ready=true label: the official ingress-nginx manifest for kind
#     (Phase 3) targets nodes with this label via nodeSelector, and already
#     tolerates the control-plane's NoSchedule taint.
#   - hostPort 80 mapped to the container's port 80: traffic reaching the codespace
#     on port 80 is forwarded into this kind node, where the Ingress controller pod
#     will be listening (Phase 3).
# Binding this now avoids recreating the cluster later just for the Ingress.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: support-desk

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
  - role: worker
  - role: worker

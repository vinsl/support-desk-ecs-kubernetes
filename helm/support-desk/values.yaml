# Default values, tuned for the local kind cluster. values-local.yaml and values-eks.yaml
# only override what differs.

replicaCount: 2  # parity with the ECS service's desired_count

image:
  repository: support-desk
  tag: dev
  pullPolicy: Never  # image is side-loaded with `kind load docker-image`, no registry involved

resources:  # limits mirror the ECS Fargate task size (256 CPU units / 512 MiB)
  requests:
    cpu: 128m
    memory: 256Mi
  limits:
    cpu: 256m
    memory: 512Mi

probes:
  path: /health  # does not touch the database, so it reflects process health only
  port: 5000
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 5
  liveness:  # more tolerant than readiness: a slow Pod should stop receiving traffic, not be killed
    initialDelaySeconds: 100
    periodSeconds: 25

db:
  host: mysql            # in-cluster headless Service; would be the RDS endpoint on EKS
  port: "3306"
  name: support_desk
  user: support_desk
  password: ""           # never set here: values-local.yaml (fake) or --set at install time
  rootPassword: ""       # only used when mysql.enabled=true

mysql:
  enabled: true          # set to false when using an external database (RDS)
  image: "mysql:8.4"
  storage: 1Gi

ingress:
  className: nginx
  annotations: {}

namespace: support-desk

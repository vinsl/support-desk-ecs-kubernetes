apiVersion: v1
kind: Secret
metadata:
  name: support-desk-secret
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "support-desk.labels" . | nindent 4 }}
type: Opaque
stringData:
  # TODO(human): DB_USER, DB_PASSWORD, MYSQL_ROOT_PASSWORD, même pattern `| quote` sur
  # les valeurs correspondantes de .Values.db (user, password, rootPassword).
  DB_USER: {{ .Values.db.user | quote }}
  DB_PASSWORD: {{ .Values.db.password | quote }}
  MYSQL_ROOT_PASSWORD: {{ .Values.db.rootPassword | quote }}

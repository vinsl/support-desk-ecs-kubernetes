apiVersion: batch/v1
kind: Job
metadata:
  name: support-desk-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    # post-install, not pre-install: pre-install hooks run before any non-hook resource of the
    # release exists, including the in-cluster MySQL and the ConfigMap/Secret this Job reads.
    # On upgrade those already exist, so pre-upgrade migrates before new Pods roll out.
    "helm.sh/hook": "post-install,pre-upgrade"
    # Delete the previous run before creating a new one, so a failed Job never blocks the next
    # install/upgrade (Job specs are immutable).
    "helm.sh/hook-delete-policy": "before-hook-creation"
spec:
  # Retries only cover transient errors: waiting for the database is the init container's job.
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        # On a cold cluster MySQL needs 100s+ (image pull plus first-boot initialisation), longer
        # than any reasonable retry budget on the Job itself. Block here until the database port
        # accepts connections (it only opens once initialisation is finished), for up to ~5 minutes.
        - name: wait-for-db
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - python
            - -c
            - |
              import os, socket, sys, time
              host, port = os.environ["DB_HOST"], int(os.environ["DB_PORT"])
              for _ in range(60):
                  try:
                      socket.create_connection((host, port), timeout=2).close()
                      sys.exit(0)
                  except OSError:
                      time.sleep(5)
              sys.exit("database not reachable after about 5 minutes")
          envFrom:
            - configMapRef:
                name: support-desk-config
      containers:
        - name: migrate
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "migrate.py"]
          envFrom:
            - configMapRef:
                name: support-desk-config
            - secretRef:
                name: support-desk-secret

apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-desk
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "support-desk.labels" . | nindent 4 }}
spec:
  # TODO(human): quelle expression pour lire le nombre de répliques depuis values.yaml ?
  replicas: {{.Values.replicaCount}}
  selector:
    matchLabels:
      {{- include "support-desk.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "support-desk.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: support-desk
          # TODO(human): l'image complète (repository + tag) depuis values.yaml.
          # Indice : deux expressions séparées par ":", comme dans deployment.yaml (k8s/local).
          image: {{printf "%s:%s" .Values.image.repository .Values.image.tag}}
          # TODO(human): la pullPolicy depuis values.yaml.
          imagePullPolicy: {{.Values.image.pullPolicy}}
          ports:
            - containerPort: {{ .Values.probes.port }}
          envFrom:
            - configMapRef:
                name: support-desk-config
            - secretRef:
                name: support-desk-secret
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.path }}
              port: {{ .Values.probes.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          # TODO(human): le bloc resources entier depuis values.yaml, sans réécrire champ par
          # champ. Indice : la fonction `toYaml` mentionnée ci-dessus, avec `nindent 12` pour
          # l'indentation (compte les espaces avant "resources:" + 2, ou observe le pattern
          # labels/selectorLabels au-dessus).
          resources:
            {{ toYaml .Values.resources | nindent 12 }}
